spring:
  application:
    name: pix-payment-processing-api
  threads:
    virtual:
      # requisições em virtual threads (sem pinning em synchronized desde o Java 24, JEP 491)
      enabled: true
  # Valores para desenvolvimento local. Em outros ambientes, sobrescreva com as
  # variáveis SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/cobrancas
    username: cobrancas
    password: cobrancas
  jpa:
    open-in-view: false
    hibernate:
      # O schema é criado pelo Flyway; o Hibernate só confere se as entidades batem com ele.
      ddl-auto: validate
  docker:
    compose:
      # Mantém o PostgreSQL rodando entre reinícios da aplicação.
      lifecycle-management: start-only

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Dados usados para montar o "Pix Copia e Cola" (BR Code) de cada cobrança.
pix:
  recebedor:
    nome: Loja Exemplo LTDA
    cidade: Sao Paulo
  # onde o payload do QR dinâmico seria publicado (example.com: ambiente simulado)
  location-base: pix.example.com/qr/v2
