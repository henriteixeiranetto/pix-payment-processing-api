name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # o runner tem Docker, então os testes com Testcontainers rodam aqui
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify
