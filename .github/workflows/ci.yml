name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Os runners do GitHub têm Docker, então os testes de integração
      # com Testcontainers (PostgreSQL real) rodam aqui.
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify
