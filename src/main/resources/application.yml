spring:
  application:
    name: pix-payment-processing-api
  threads:
    virtual:
      # requisições em virtual threads (sem pinning em synchronized desde o Java 24, JEP 491)
      enabled: true
  # credenciais de desenvolvimento; em outro ambiente, use SPRING_DATASOURCE_*
  datasource:
    url: jdbc:postgresql://localhost:5432/cobrancas
    username: cobrancas
    password: cobrancas
  jpa:
    open-in-view: false
    hibernate:
      # o schema é do Flyway; o Hibernate só valida
      ddl-auto: validate
  docker:
    compose:
      # sobe o banco, mas não derruba quando a aplicação para
      lifecycle-management: start-only

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# usados no Pix Copia e Cola de cada cobrança
pix:
  recebedor:
    nome: Loja Exemplo LTDA
    cidade: Sao Paulo
  # onde o payload do QR dinâmico seria publicado (example.com: ambiente simulado)
  location-base: pix.example.com/qr/v2
